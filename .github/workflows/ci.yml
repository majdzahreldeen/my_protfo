name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Serve built site
        run: npx http-server dist -p 8080 & sleep 2
      - name: Run Lighthouse
        run: npx lighthouse http://127.0.0.1:8080 --quiet --chrome-flags="--no-sandbox --headless" --output=json --output-path=lh-report.json --only-categories=performance,accessibility,best-practices,seo
      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        with:
          name: lh-report
          path: lh-report.json
